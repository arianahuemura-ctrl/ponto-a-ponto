<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{% url 'usability-asset' 'player.css' %}"><style>
:root{--player-bg:#fff;--player-fg:#333;--player-line:#ddd;color-scheme:light}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--player-bg);color:var(--player-fg);font-family:system-ui}
#player{width:100%;height:100%}
.rr-player,.rr-controller{background:var(--player-bg)!important;color:var(--player-fg)!important;box-shadow:none!important;float:none!important;margin:auto}
.rr-timeline__time,.rr-controller__btns button{color:var(--player-fg)!important}
.rr-controller__btns button.active{color:#fff!important}
.rr-controller__btns svg{fill:currentColor}
.rr-progress{border-color:var(--player-bg)!important;background:var(--player-line)!important}
.rr-progress__step{background:#7c80d6!important}
</style></head><body><div id="player"></div>{{ events|json_script:"events" }}<script src="{% url 'usability-asset' 'player.js' %}"></script><script src="{% url 'usability-asset' 'replay-theme.js' %}"></script><script>function syncTheme(){let source=document.documentElement;try{if(parent!==window)source=parent.document.documentElement;}catch{}const css=getComputedStyle(source),root=document.documentElement;root.style.setProperty('--player-bg',css.getPropertyValue('--body-bg').trim()||'#fff');root.style.setProperty('--player-fg',css.getPropertyValue('--body-fg').trim()||'#333');root.style.setProperty('--player-line',css.getPropertyValue('--border-color').trim()||'#ddd');root.style.colorScheme=source.dataset.theme==='dark'?'dark':'light';}
syncTheme();try{if(parent!==window)new MutationObserver(syncTheme).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme','style','class']});}catch{}matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncTheme);
const events=JSON.parse(document.getElementById('events').textContent);if(events.length>1){const player=new (rrwebPlayer.default||rrwebPlayer)({target:document.getElementById('player'),props:{events,autoPlay:false,width:Math.max(1,document.documentElement.clientWidth),height:Math.max(1,innerHeight-80),UNSAFE_replayCanvas:true,speedOption:[0.5,1,2,4]}});papReplayTheme(player,events);const at=Number(new URLSearchParams(location.search).get('at'));if(Number.isFinite(at)&&at>0)player.goto(Math.min(at,player.getMetaData().totalTime),false);let pending;const resize=()=>{cancelAnimationFrame(pending);pending=requestAnimationFrame(()=>{player.$set({width:Math.max(1,document.documentElement.clientWidth),height:Math.max(1,innerHeight-80)});player.triggerResize();});};new ResizeObserver(resize).observe(document.documentElement);window.addEventListener('resize',resize);resize();}else document.getElementById('player').textContent='Sem dados visuais suficientes.';</script></body></html>
